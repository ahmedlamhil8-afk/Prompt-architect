<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Prompt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%233B3FC2'%3E%3Crect x='6' y='6' width='20' height='20'/%3E%3Crect x='6' y='6' width='20' height='20' transform='rotate(45 16 16)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FB;--surface:#fff;--ink:#12141F;--muted:#5B6075;--line:#D9DDEC;--brand:#3B3FC2;--on-brand:#fff;--tint:#E4E6F6;--mark:#FFE9A8;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1118;--surface:#171A26;--ink:#ECEEF8;--muted:#9AA0B8;--line:#2A2E42;--brand:#BEC0FF;--on-brand:#1A1D8C;--tint:#2E3144;--mark:#5A4A12;--err:#F2B8B5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header,main{max-width:720px;margin:0 auto;padding-inline:20px}
header{display:flex;align-items:center;justify-content:space-between;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--brand)}
.brand svg{width:28px;height:28px}
main{display:grid;gap:20px;padding-bottom:64px}
h1{margin:8px 0 0;font-size:clamp(1.9rem,6vw,2.75rem);line-height:1.15;letter-spacing:-.02em}
.lead,.muted{color:var(--muted);margin:0}
.label{font-size:.875rem;font-weight:500;color:var(--muted);display:block;margin-bottom:6px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:10px 4px;font-size:.95rem}
